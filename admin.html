<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoxWare - Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <body style="visibility: hidden;"></body>

  <!-- Encabezado con Logo -->
  <header class="main-header">
    <div class="logo-container">
      <img src="img/logo.png" alt="RoxWare Logo" class="site-logo">
    </div>
  </header>

  <!-- Barra de Navegación Admin -->
  <nav class="navbar">
    <div class="nav-container">
      <ul class="nav-links">
        <li><a href="index.html">Ver Tienda</a></li>
      </ul>
      <button id="btn-logout" class="nav-login-btn btn-danger" title="Cerrar Sesión" style="background: none; color: #e74c3c; border: none; font-size: 1.2rem; cursor: pointer;">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <!-- Sección de Administración -->
  <section class="admin-section">
    <div class="admin-container">
      <h2 class="title-primary" style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">Panel de Administración</h2>

      <!-- Formulario para agregar productos -->
      <div class="admin-form-card">
        <h3>Agregar Nuevo Producto</h3>
        <form id="form-producto" class="modal-form">
          <div class="form-group">
            <label for="nombre">Nombre del Producto</label>
            <input type="text" id="nombre" required>
          </div>

          <div class="form-group">
            <label for="precio">Precio ($)</label>
            <input type="number" step="0.01" id="precio" required>
          </div>

          <!-- 👇 SELECTOR DE CATEGORÍA (nuevo) -->
          <div class="form-group">
            <label for="categoria">Categoría</label>
            <select id="categoria" required>
              <option value="" disabled selected>Selecciona una categoría</option>
              <option value="filtros">Sistema de filtros</option>
              <option value="sartenes">Sartenes y cocina</option>
              <option value="botellas">Botellas térmicas</option>
              <option value="otros">Otros</option>
            </select>
          </div>

          <div class="form-group">
            <label for="imagen_url">URL de la Imagen</label>
            <input type="text" id="imagen_url" required placeholder="https://ejemplo.com/imagen.jpg">
          </div>

          <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="3" required></textarea>
          </div>

          <button type="submit" class="admin-submit-btn">Guardar Producto</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Catálogo de Administración -->
  <section class="catalog-section">
    <h3 class="catalog-title">Gestión de Catálogo</h3>
    <div class="catalog-grid" id="contenedor-admin-productos">
      <!-- Carga dinámica desde Supabase -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="main-footer">
    <p class="footer-brand">RoxWare Admin</p>
    <p class="footer-copy">Derechos reservados 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
